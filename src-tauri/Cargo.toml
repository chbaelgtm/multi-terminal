[package]
name = "multi-terminal"
version = "0.1.0"
description = "A four-pane desktop terminal"
edition = "2021"

[lib]
name = "multi_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
fontdb = "0.23"

[profile.release]
strip = true
lto = "thin"
